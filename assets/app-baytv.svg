<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="bayGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#bayBg)" filter="url(#bayGlow)" />
  <rect x="8" y="8" width="104" height="104" rx="24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- Modern Geometric B/Play Shape -->
  <circle cx="60" cy="50" r="22" fill="rgba(255, 255, 255, 0.2)" />
  <polygon points="53,38 72,50 53,62" fill="#ffffff" filter="url(#bayGlow)" />
  
  <!-- Bay TV Pill Badge -->
  <rect x="24" y="88" width="72" height="18" rx="9" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="60" y="100" fill="#fde047" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">BAY TV</text>
</svg>
