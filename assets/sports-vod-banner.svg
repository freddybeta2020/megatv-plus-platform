<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#050a17"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="450" rx="16" fill="url(#bannerBg)"/>

  <!-- Resplandores -->
  <circle cx="200" cy="150" r="140" fill="#2563eb" opacity="0.25" filter="url(#bannerGlow)"/>
  <circle cx="800" cy="300" r="160" fill="#f97316" opacity="0.2" filter="url(#bannerGlow)"/>

  <!-- Encabezado de la Sección de Contenido -->
  <text x="500" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff">TODO EL ENTRETENIMIENTO EN UN SOLO LUGAR</text>
  <text x="500" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#94a3b8">Más de 15,000 canales en vivo, 50,000 películas y 12,000 series actualizadas</text>

  <!-- Tarjeta 1: Deportes en Vivo -->
  <g transform="translate(60, 140)">
    <rect width="260" height="260" rx="14" fill="url(#cardGrad1)" stroke="rgba(37,99,235,0.4)" stroke-width="2"/>
    <circle cx="130" cy="90" r="40" fill="rgba(37,99,235,0.3)"/>
    <text x="130" y="102" text-anchor="middle" font-size="34">⚽</text>
    <text x="130" y="160" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">Fútbol &amp; Deportes</text>
    <text x="130" y="185" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#38bdf8">Champions, LaLiga, F1, UFC</text>
    <rect x="50" y="210" width="160" height="28" rx="14" fill="rgba(37,99,235,0.8)"/>
    <text x="130" y="228" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">CALIDAD 4K Y FHD</text>
  </g>

  <!-- Tarjeta 2: Cine & Series VOD -->
  <g transform="translate(370, 140)">
    <rect width="260" height="260" rx="14" fill="url(#cardGrad2)" stroke="rgba(249,115,22,0.4)" stroke-width="2"/>
    <circle cx="130" cy="90" r="40" fill="rgba(249,115,22,0.3)"/>
    <text x="130" y="102" text-anchor="middle" font-size="34">🍿</text>
    <text x="130" y="160" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">Cine &amp; Series VOD</text>
    <text x="130" y="185" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#fb923c">Estrenos 2026 Semanales</text>
    <rect x="50" y="210" width="160" height="28" rx="14" fill="rgba(249,115,22,0.8)"/>
    <text x="130" y="228" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">+60,000 TÍTULOS</text>
  </g>

  <!-- Tarjeta 3: Canales Internacionales & Niños -->
  <g transform="translate(680, 140)">
    <rect width="260" height="260" rx="14" fill="url(#cardGrad3)" stroke="rgba(16,185,129,0.4)" stroke-width="2"/>
    <circle cx="130" cy="90" r="40" fill="rgba(16,185,129,0.3)"/>
    <text x="130" y="102" text-anchor="middle" font-size="34">🌍</text>
    <text x="130" y="160" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">Mundo &amp; Familia</text>
    <text x="130" y="185" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#34d399">Canales de +50 Países</text>
    <rect x="50" y="210" width="160" height="28" rx="14" fill="rgba(16,185,129,0.8)"/>
    <text x="130" y="228" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">INFANTIL &amp; NOTICIAS</text>
  </g>
</svg>
