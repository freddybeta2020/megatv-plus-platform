<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="iboBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="iboPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="iboGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#iboBg)" filter="url(#iboGlow)" />
  <rect x="8" y="8" width="104" height="104" rx="24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- Play Symbol / Triangle -->
  <path d="M 48 36 L 82 60 L 48 84 Z" fill="url(#iboPlay)" filter="url(#iboGlow)" />
  
  <!-- IBO Pill Badge -->
  <rect x="22" y="88" width="76" height="18" rx="9" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="60" y="100" fill="#38bdf8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">IBO PLAYER</text>
</svg>
