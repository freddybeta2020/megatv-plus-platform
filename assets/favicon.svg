<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Fondo con gradiente oscuro y borde resplandeciente -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente de Play Icon: Azul Eléctrico a Naranja Fuego -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Gradiente del Símbolo Plus (+) -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ff8c37" />
    </linearGradient>

    <!-- Filtro de Resplandor Neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Forma Contenedora del Logo (Squircle redondeado) -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#playGrad)" stroke-width="4" />

  <!-- Triángulo Play 3D estilizado -->
  <path d="M 44 34 Q 44 30 48 32 L 88 59 Q 92 62 88 65 L 48 92 Q 44 94 44 90 Z" fill="url(#playGrad)" filter="url(#neonGlow)" />

  <!-- Detalle de Brillo en el Play -->
  <path d="M 48 36 L 80 58 L 48 68 Z" fill="#ffffff" opacity="0.2" />

  <!-- Símbolo PLUS (+) Estilizado en la esquina -->
  <g transform="translate(86, 24)" filter="url(#neonGlow)">
    <rect x="-3" y="-10" width="6" height="20" rx="3" fill="url(#plusGrad)" />
    <rect x="-10" y="-3" width="20" height="6" rx="3" fill="url(#plusGrad)" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>
</svg>
